name: Deploy Flutter Web

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build web --release --base-href /

      # GitHub Pages otherwise returns the SPA fallback with a 404 status for
      # direct visits to these routes. Generate route-specific 200-status HTML
      # entry documents with unique metadata and crawlable page summaries.
      - run: dart run tool/generate_seo_pages.dart build/web

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
